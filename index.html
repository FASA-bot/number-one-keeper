<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Number One">
<meta name="theme-color" content="#0e3a2b">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Number One Keeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a floodlit pitch seen from above. Chalk lines on mown turf, one keeper-kit orange. */
  --pitch:#0e3a2b;
  --stripe:#104030;
  --turf:#17503d;
  --turf-hi:#1e6049;
  --chalk:#f3f6ee;
  --mute:#a8c4b5;
  --line:rgba(243,246,238,.2);
  --kit:#ff6f1f;
  --kit-ink:#1c0f04;
  --card:#ffd43b;
  --good:#86e39a;
  --bad:#ff8d85;
  --display:"Big Shoulders Display","Arial Narrow","Impact",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--pitch);color:var(--chalk);font:400 16px/1.45 var(--body);
  background-image:repeating-linear-gradient(180deg,var(--pitch) 0 72px,var(--stripe) 72px 144px);overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--pitch)}
.mark{white-space:nowrap;font:900 23px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.mark b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--kit);color:var(--kit-ink);font-size:20px}
.kick{margin-left:auto;white-space:nowrap;font-size:13px;color:var(--mute);text-align:right;line-height:1.2}
.kick strong{display:block;color:var(--chalk);font:700 20px/1 var(--display);letter-spacing:.03em}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
main>*{flex-shrink:0}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--pitch);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;color:var(--mute);text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.03em}
nav a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a[aria-current="page"]{color:var(--kit)}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance;line-height:1}
h1{font-size:44px;font-weight:900}
h2{font-size:24px;font-weight:700}
h3{font-size:19px;font-weight:700}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--card)}
.panel{background:var(--turf);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{position:relative;overflow:hidden;border:2px solid var(--chalk);border-radius:6px;padding:20px 18px 18px;background:var(--turf);display:flex;flex-direction:column;gap:10px}
.hero svg.box{position:absolute;inset:0;width:100%;height:100%;opacity:.2;pointer-events:none}
.hero>*:not(svg){position:relative}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn{appearance:none;border:0;border-radius:10px;min-height:48px;padding:0 18px;font:700 20px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;background:var(--kit);color:var(--kit-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--chalk);border:1.5px solid var(--line)}
.btn.sm{min-height:40px;font-size:16px;padding:0 12px}
.btn:active{transform:translateY(1px)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--card);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.chip.on{background:var(--chalk);color:var(--pitch);border-color:var(--chalk)}
.chip.kit{border-color:var(--kit);color:var(--kit)}
button.chip{appearance:none;background:none;font-family:var(--body);cursor:pointer;min-height:34px}
button.chip.on{background:var(--chalk)}
.blocks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.blocks li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.blocks li:first-child{border-top:0}
.blocks .n{font:700 20px/1 var(--display);color:var(--mute)}
.blocks .t{font-weight:600}
.blocks .m{font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:none;color:var(--mute);font:600 15px var(--body);min-height:42px;cursor:pointer}
.seg button.on{background:var(--chalk);color:var(--pitch)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.days div{font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px}
.days i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:block}
.days .done i{background:var(--kit);border-color:var(--kit)}
.days .now{color:var(--chalk);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--turf);border:1px solid var(--line);border-radius:12px;padding:12px 10px}
.tile b{display:block;font:900 34px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mute);line-height:1.2;display:block;margin-top:4px}
.dlist{display:flex;flex-direction:column;gap:8px}
.ditem{appearance:none;text-align:left;width:100%;background:var(--turf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--chalk);font:inherit;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.ditem .t{font-weight:600;font-size:17px}
.ditem .s{grid-column:1/-1;font-size:13px;color:var(--mute)}
.ditem .v{font:700 20px/1 var(--display);color:var(--card);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.diagram{background:var(--pitch);border:1px solid var(--line);border-radius:10px;width:100%;display:block}
.diagram .ln{fill:none;stroke:var(--chalk);stroke-width:1.5;opacity:.6}
.diagram .faint{fill:none;stroke:var(--chalk);stroke-width:1;opacity:.25;stroke-dasharray:3 4}
.diagram .mv{fill:none;stroke:var(--card);stroke-width:2;stroke-dasharray:5 4}
.diagram .bl{fill:none;stroke:var(--chalk);stroke-width:2}
.diagram .kp{fill:var(--kit)}
.diagram .pl{fill:none;stroke:var(--chalk);stroke-width:2}
.diagram .ball{fill:var(--chalk)}
.diagram .cone{fill:var(--card)}
.diagram .wall{fill:var(--mute)}
.diagram text{fill:var(--mute);font:600 10px var(--body)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.cue{border-left:3px solid var(--kit);padding:2px 0 2px 12px;font-weight:500}
.clock{font:900 84px/1 var(--display);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.02em}
.clock.done{color:var(--card)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--kit)}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.stepper button{appearance:none;border:1.5px solid var(--line);background:none;color:var(--chalk);border-radius:10px;height:52px;font:700 28px/1 var(--display);cursor:pointer}
input,textarea,select{font:500 17px var(--body);color:var(--chalk);background:var(--pitch);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:48px}
textarea{min-height:76px;resize:vertical}
.stepper input{text-align:center;font:900 30px/1 var(--display);height:52px;padding:0}
label{font-size:13px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;gap:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rate button{appearance:none;border:1.5px solid var(--line);background:none;color:var(--chalk);border-radius:10px;height:52px;font:900 26px/1 var(--display);cursor:pointer}
.rate button.on{background:var(--kit);border-color:var(--kit);color:var(--kit-ink)}
.bar{display:grid;grid-template-columns:104px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--kit);border-radius:5px}
.bar .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar.none .pc{color:var(--mute);font-weight:400}
.hist{display:grid;grid-template-columns:1fr 84px auto;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.hist:first-of-type{border-top:0}
.hist .v{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.hist .v small{display:block;font:500 11px var(--body);color:var(--mute);margin-top:3px}
.spark{width:84px;height:30px;display:block}
.match{border-top:1px dashed var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.match:first-of-type{border-top:0}
.match .big{font:900 28px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--card);text-align:right}
.match .meta{grid-column:1/-1;font-size:13px;color:var(--mute)}
.vids{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.vid{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--chalk);text-decoration:none;font-size:15px;line-height:1.3}
.vid .play{width:44px;height:44px;border-radius:50%;background:var(--kit);position:relative}
.vid .play::after{content:"";position:absolute;left:17px;top:13px;border-left:14px solid var(--kit-ink);border-top:9px solid transparent;border-bottom:9px solid transparent}
.more{color:var(--mute);font-size:14px;padding:6px 0;min-height:32px}
.linkbtn{appearance:none;background:none;border:0;color:var(--mute);font:500 13px var(--body);text-decoration:underline;cursor:pointer;padding:6px 0;min-height:32px}
.gear{appearance:none;background:none;border:1.5px solid var(--line);color:var(--chalk);width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.note{font-size:14px;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.ok{color:var(--good)}.warn{color:var(--bad)}
.empty{text-align:center;color:var(--mute);padding:18px 8px;font-size:15px}
@media (prefers-reduced-motion:no-preference){.hero h1{animation:rise .5s ease-out both}@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark"><b>1</b>Number One</div>
    <div class="kick" id="kick"></div>
    <button class="gear" data-act="settings" aria-label="Settings" id="gear"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg></button>
  </header>
  <main id="main"></main>
  <nav id="nav">
    <a href="#today" data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg>Today</a>
    <a href="#drills" data-v="drills"><svg viewBox="0 0 24 24"><path d="M12 3l5.5 15h-11zM4 21h16M9 12h6"/></svg>Drills</a>
    <a href="#matches" data-v="matches"><svg viewBox="0 0 24 24"><path d="M3 19V6h18v13M3 10h18M8 6v13M13 6v13M18 6v13"/></svg>Matches</a>
    <a href="#progress" data-v="progress"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/></svg>Progress</a>
  </nav>
</div>
<script>
"use strict";
/* ---------- Drill library ---------- */
const AREAS={h:"Handling",f:"Footwork",d:"Diving",r:"Reactions",c:"Crosses",p:"Distribution",v:"1v1s",s:"Shot-stopping",a:"Agility",k:"Conditioning"};
const D={
wu:{n:"Dynamic warm-up",a:"w",m:5,kit:"A ball",who:"solo",dg:"",steps:["Jog two minutes, then high knees, heel flicks and side shuffles across 10 metres.","Leg swings and arm circles, 10 each side.","Finish with 20 gentle catches from your own throws, getting higher each time."],cue:"Arrive at the first drill warm, with hands that have already felt the ball."},
cd:{n:"Cool down and stretch",a:"w",m:4,kit:"None",who:"solo",dg:"",steps:["Walk for a minute and let your breathing settle.","Hold each stretch 20 seconds: hamstrings, quads, hips, shoulders, wrists.","Drink some water."],cue:"Slow down properly. Tomorrow's legs depend on it."},
h1:{n:"Wall W-catch",a:"h",m:5,kit:"Ball, wall",who:"solo",dg:"wall",steps:["Stand 3 to 5 metres from a wall in your set position.","Throw at chest to head height and catch the rebound with thumbs together in a W.","Bring every catch into your chest before the next throw."],cue:"Hands out in front, watch the ball all the way into your gloves.",met:{t:"of",n:20,l:"clean catches"}},
h2:{n:"Scoop and cup",a:"h",m:5,kit:"Ball, wall",who:"solo",dg:"wall",steps:["Throw low at the wall so the ball comes back along the ground or at shin height.","Get your body behind it. Little fingers together, scoop it up into your chest.","Alternate: one rolling ball, one bouncing at stomach height that you cup."],cue:"Second barrier every time: legs or body behind your hands.",met:{t:"of",n:20,l:"clean takes"}},
h3:{n:"Volley hands",a:"h",m:6,kit:"Ball, partner",who:"partner",alt:["h1","h2"],dg:"serve",steps:["Your partner volleys from their hands at you from 8 metres.","Mix the height: chest, head, just above your head.","Catch, hold for a second, roll it back."],cue:"Soft elbows. Let your arms give a little as the ball arrives.",met:{t:"of",n:15,l:"clean catches"}},
f1:{n:"Post to post shuffles",a:"f",m:4,kit:"2 cones",who:"solo",dg:"shuffle",steps:["Place two cones 4 metres apart.","Shuffle between them without crossing your feet and touch each cone.","Work 30 seconds, rest 30 seconds. Count your best round."],cue:"Stay low, on the balls of your feet, hands ready the whole way.",met:{t:"count",l:"cone touches in 30 seconds"}},
f2:{n:"Cone weave to set",a:"f",m:5,kit:"5 cones, ball",who:"solo",dg:"weave",steps:["Line up five cones a stride apart.","Quick feet through the cones, then stop dead in your set position.","Throw the ball up as you set and catch it clean. That is one rep."],cue:"Feet still before the ball is struck. Moving keepers get beaten.",met:{t:"of",n:10,l:"clean reps"}},
f3:{n:"Arc steps",a:"f",m:5,kit:"3 cones, goal",who:"solo",dg:"arc",steps:["Put three cones out at the edge of the box: left, centre, right.","Call a cone, move along your arc so you are on the line between that cone and the middle of the goal.","Set, then check: can you touch your near post in two steps?"],cue:"Cover the near post first, then come out as far as you can still protect the far one.",met:{t:"of",n:10,l:"good positions"}},
d1:{n:"Kneeling collapse dive",a:"d",m:5,kit:"Ball, soft ground",who:"solo",dg:"dive",steps:["Kneel with a ball placed an arm's length to each side.","Fall sideways onto your hip and shoulder and take the ball with both hands.","One hand behind the ball, one on top, ball as the third hand on the ground."],cue:"Land on your side, never your elbow or your stomach.",met:{t:"of",n:20,l:"clean holds"}},
d2:{n:"Low dive from set",a:"d",m:6,kit:"2 balls, soft ground",who:"solo",dg:"dive",steps:["Start in your set position with a ball two steps to each side.","Take a short step toward the ball, push off that leg and dive low.","Attack the ball: hands lead, body follows. Get up fast, go the other side."],cue:"Step forward and across. Diving backwards opens the goal.",met:{t:"of",n:12,l:"clean dives"}},
d3:{n:"Step and dive",a:"d",m:6,kit:"Ball, partner, goal",who:"partner",alt:["d2","d1"],dg:"serve",steps:["Your partner serves from 8 metres, underarm first, then side-foot.","Balls go to either side at knee to waist height.","Hold it if you can. If not, push it wide of the post."],cue:"Top hand comes over to trap the ball. No spills into the middle.",met:{t:"of",n:12,l:"saves held or pushed wide"}},
d4:{n:"Double save recovery",a:"d",m:6,kit:"2 balls, partner",who:"partner",alt:["a2","d2"],dg:"serve",steps:["Save a low ball to one side.","Get up without using your hands behind you and reset.","Your partner plays a second ball to the other side straight away."],cue:"Roll forward onto your knee and push up. The second save wins matches.",met:{t:"of",n:8,l:"double saves"}},
r1:{n:"Tennis ball one hand",a:"r",m:5,kit:"Tennis ball, wall",who:"solo",dg:"wall",steps:["Stand 2 to 3 metres from the wall with a tennis ball.","Throw with one hand, catch with the other. No glove.","Step closer every ten catches."],cue:"Eyes level and still. Move your hands, not your head.",met:{t:"of",n:30,l:"clean catches"}},
r2:{n:"Drop ball",a:"r",m:4,kit:"2 tennis balls, partner",who:"partner",alt:["r1","a2"],dg:"",steps:["Your partner holds a tennis ball in each hand at shoulder height.","Stand a step away in your set position.","They drop one without warning. Catch it before the second bounce."],cue:"Weight forward on your toes so the first move is quick.",met:{t:"of",n:10,l:"caught"}},
r3:{n:"Close range parry",a:"r",m:5,kit:"Ball, partner",who:"partner",alt:["a2","r1"],dg:"serve",steps:["Your partner volleys firmly from 5 metres, anywhere within reach.","Do not try to catch. Parry with strong open palms.","Aim every parry wide, away from the middle of the goal."],cue:"Strong wrists, fingers spread. Decide where the ball goes.",met:{t:"of",n:12,l:"parried wide"}},
c1:{n:"High point catch",a:"c",m:5,kit:"Ball",who:"solo",dg:"high",steps:["Throw the ball high above you.","Take two steps, drive one knee up and jump off the other leg.","Catch at the very top of your jump and shout \"Keeper's!\" as you go."],cue:"Take it early and high. The loud call is part of the save.",met:{t:"of",n:15,l:"caught at full stretch"}},
c2:{n:"Claim from wide",a:"c",m:7,kit:"Ball, partner, goal",who:"partner",alt:["c1","c3"],dg:"cross",steps:["Start on your line, side on, facing the wing.","Your partner throws or crosses from wide toward the six-yard line.","Decide early: come and claim, or stay. If you come, call and catch at the top."],cue:"Wait, read the flight, then go hard. Late and fast beats early and stuck.",met:{t:"of",n:10,l:"crosses claimed"}},
c3:{n:"Punch for distance",a:"c",m:4,kit:"Ball, 1 cone",who:"solo",dg:"high",steps:["Put a cone 8 metres in front of you.","Throw the ball up and punch it with both fists together.","Go for height and distance. It counts if it lands past the cone."],cue:"Punch through the bottom half of the ball with locked wrists.",met:{t:"of",n:10,l:"past the cone"}},
p1:{n:"Wall target passing",a:"p",m:5,kit:"Ball, wall, chalk or tape",who:"solo",dg:"wall",steps:["Mark a one-metre target low on the wall.","Pass from 8 metres with the inside of your foot and control the rebound.","Ten with your right foot, ten with your left."],cue:"Two touches: one to set it out of your feet, one to pass.",met:{t:"of",n:20,l:"on target"}},
p2:{n:"Driven pass through the gate",a:"p",m:6,kit:"Ball, 2 cones",who:"solo",dg:"target",steps:["Make a gate four metres wide, 25 metres away.","Strike a driven pass off the ground through the gate.","Move the gate left and right so you hit both full-back positions."],cue:"Plant foot beside the ball, lock your ankle, follow through at the target.",met:{t:"of",n:10,l:"through the gate"}},
p3:{n:"Overarm throw to target",a:"p",m:5,kit:"Ball, 2 cones",who:"solo",dg:"target",steps:["Make a gate three metres wide, 20 metres away.","Side on, straight arm, bowl the ball over the top.","It should arrive flat and easy to control."],cue:"Point your front hand at the target and step toward it.",met:{t:"of",n:10,l:"through the gate"}},
p4:{n:"Side volley to zone",a:"p",m:5,kit:"Ball, 4 cones",who:"solo",dg:"target",steps:["Mark a 10 metre square zone about 30 metres away.","Drop the ball from waist height and strike it side on before it lands.","Keep it low and fast, landing in the zone."],cue:"Drop the ball, do not throw it up. Lean away and swing across your body.",met:{t:"of",n:10,l:"landed in the zone"}},
p5:{n:"Back pass and switch",a:"p",m:5,kit:"Ball, wall, 2 cones",who:"solo",dg:"wall",steps:["Pass against the wall. That rebound is your back pass.","Open your body and take your first touch away from the side it came from.","Play your second touch past the cone on the other side."],cue:"Scan over your shoulder before the ball arrives.",met:{t:"of",n:20,l:"clean switches"}},

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const today=()=>ymd(new Date());
const nice=s=>parse(s).toLocaleDateString("en-IE",{day:"numeric",month:"short"});
function weekKey(s){const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d);}
function shift(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function weekCount(wk){let n=0;for(let i=0;i<7;i++)if(state.days[shift(wk,i)])n++;return n;}
function streak(){let wk=weekKey(today()),n=0;if(weekCount(wk)<state.goal)wk=shift(wk,-7);while(weekCount(wk)>=state.goal&&n<520){n++;wk=shift(wk,-7);}return n;}
function kickoff(){if(state.kickoff)return state.kickoff;const d=new Date();return (d.getFullYear()+1)+"-01-01";}
function daysTo(){return Math.round((parse(kickoff())-parse(today()))/864e5);}
function best(id){const a=state.scores[id]||[];if(!a.length)return null;const v=a.map(x=>x.v);return D[id].met.t==="time"?Math.min(...v):Math.max(...v);}
function last(id){const a=state.scores[id]||[];return a.length?a[a.length-1].v:null;}
function metText(m){return m.t==="of"?m.l+", out of "+m.n:m.l;}
function showScore(id,v){const m=D[id].met;return m.t==="of"?v+"/"+m.n:m.t==="time"?v+"s":String(v);}
function sessionAt(idx){const i=((idx%TOTAL)+TOTAL)%TOTAL,w=Math.floor(i/3),s=i%3;const out=[];
  WEEKS[w][1][s].forEach(id=>{let pick=id;if(!state.partner&&D[id].who==="partner"){pick=(D[id].alt||[]).find(a=>!out.includes(a)&&!WEEKS[w][1][s].includes(a))||(D[id].alt||[]).find(a=>!out.includes(a));}
    if(pick&&!out.includes(pick))out.push(pick);});
  const blocks=["wu",...out,"cd"];
  return {i,week:w+1,letter:"ABC"[s],theme:WEEKS[w][0],blocks,mins:blocks.reduce((t,b)=>t+D[b].m,0)};}
function areaPct(a){const ids=Object.keys(D).filter(id=>D[id].a===a&&D[id].met&&D[id].met.t==="of"&&last(id)!=null);
  if(!ids.length)return null;return Math.round(100*ids.reduce((t,id)=>t+last(id)/D[id].met.n,0)/ids.length);}

   angles:`${goal}<path d="M92 40Q150 86 208 40" class="mv"/>${kp(150,62)}${pl(50,128)}${pl(150,136)}${pl(250,128)}<path d="M54 122L110 22M54 122L190 22M246 122L110 22M246 122L190 22" class="faint"/>`,

  <div class="legend"><span><i style="background:var(--kit)"></i>You</span><span><i style="background:var(--chalk)"></i>Ball path</span><span><i style="background:var(--card)"></i>Your movement, cones</span></div>`;

function spark(vals,lowerBetter){
  if(vals.length<2)return `<svg class="spark" viewBox="0 0 84 30"><circle cx="78" cy="15" r="3" fill="var(--kit)"/></svg>`;
  const mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>[4+i*(74/(vals.length-1)),4+22*(lowerBetter?(v-mn)/r:1-(v-mn)/r)]);
  const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 84 30"><polygon points="4,29 ${line} 78,29" fill="var(--kit)" opacity=".18"/><polyline points="${line}" fill="none" stroke="var(--kit)" stroke-width="2" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="var(--chalk)"/></svg>`;
}

    case "toggle":if(!r)break;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(x){}
      if(r.endAt){r.left=remaining();r.endAt=null;hush();awake(false);}else if(r.left>0){const resumed=(r.total||0)>r.left;r.endAt=Date.now()+r.left*1000;beeped=false;awake(true);prime();preload();if(resumed)say("Go.");coach();}save();break;
    case "plus":if(!r)break;if(r.endAt)r.endAt+=60000;else r.left+=60;r.total=(r.total||0)+60;if(r.fired)Object.keys(r.fired).forEach(k=>{if(k[0]==="e")delete r.fired[k];});beeped=false;save();break;
    case "inc":case "dec":{if(!r)break;const id=r.blocks[r.i],m=D[id].met;let v=(r.scores[id]==null?0:r.scores[id])+(act==="inc"?1:-1);v=Math.max(0,v);if(m.t==="of")v=Math.min(m.n,v);r.scores[id]=Math.round(v*10)/10;save();const inp=$("#score");if(inp)inp.value=r.scores[id];return;}
    case "next-block":if(!r)break;
      if(r.i<r.blocks.length-1){setBlock(r.i+1);save();}
      else if(r.kind==="free"){const d=today();logScores(r,d);state.days[d]=1;state.run=null;hush();awake(false);save();}
      else{r.phase="reflect";r.endAt=null;hush();awake(false);say(useClips()||!state.name?DONE:"Session done. Great work, "+state.name+". How did that feel?");save();}
      scroll=true;break;
    case "back-block":if(!r)break;if(r.phase==="reflect"){r.phase="drill";}else if(r.i>0)setBlock(r.i-1);save();scroll=true;break;
    case "conf":if(r){r.conf=+el.dataset.n;save();}break;
    case "finish":if(!r)break;{const d=today();logScores(r,d);state.days[d]=1;state.sessions.push({d,title:r.title,mins:r.mins,conf:r.conf||0,note:r.note||"",scores:r.scores});state.planIdx++;state.run=null;save();location.hash="progress";scroll=true;}break;
    case "quit":if(ui.quit){state.run=null;ui.quit=false;hush();awake(false);save();scroll=true;}else ui.quit=true;break;
    case "mrate":ui.mrate=ui.mrate===+el.dataset.n?0:+el.dataset.n;document.querySelectorAll('[data-act="mrate"]').forEach(b=>b.classList.toggle("on",+b.dataset.n===ui.mrate));return;
    case "add-match":{const pg=num("#m-pg"),pt=num("#m-pt");
      if(pg>pt){ui.msg="Passes that found a teammate cannot be more than passes tried.";const keep={};["d","o","s","c","x","m","pg","pt","n"].forEach(k=>keep[k]=$("#m-"+k).value);render();Object.keys(keep).forEach(k=>$("#m-"+k).value=keep[k]);return;}
      state.matches.push({id:Date.now().toString(36),d:$("#m-d").value||today(),o:$("#m-o").value.trim(),s:num("#m-s"),c:num("#m-c"),x:num("#m-x"),m:num("#m-m"),pg,pt,r:ui.mrate,n:$("#m-n").value.trim()});ui.mrate=0;ui.msg="";save();}break;
    case "del-match":state.matches=state.matches.filter(m=>m.id!==el.dataset.id);save();break;
    case "mk-backup":{const code=btoa(unescape(encodeURIComponent(JSON.stringify(state))));const ta=$("#backup");ta.value=code;ta.select();
      const done=m=>{ui.msg=m;const keep=ta.value;render();$("#backup").value=keep;};
      try{navigator.clipboard.writeText(code).then(()=>done("Backup code copied. Paste it somewhere safe."),()=>done("Backup code is in the box. Select it and copy."));}catch(x){done("Backup code is in the box. Select it and copy.");}return;}
    case "restore":{try{const obj=JSON.parse(decodeURIComponent(escape(atob($("#backup").value.trim()))));if(!obj||!Array.isArray(obj.sessions))throw 0;state=Object.assign(fresh(),obj);state.run=null;save();ui.msg="Scores restored.";}catch(x){ui.msg="Could not read that code. Paste the whole backup code and try again.";}}break;
  }
  render();if(scroll)toTop();
});
document.addEventListener("input",e=>{
  const t=e.target,r=state.run;
  if(t.dataset.bind==="score"&&r){const id=r.blocks[r.i],m=D[id].met;let v=parseFloat(t.value);if(isNaN(v)){delete r.scores[id];}else{v=Math.max(0,v);if(m.t==="of")v=Math.min(m.n,v);r.scores[id]=v;}save();}
  if(t.dataset.bind==="note"&&r){r.note=t.value;save();}
});
document.addEventListener("change",e=>{
  const t=e.target,k=t.dataset.set;if(!k)return;
  if(k==="goal")state.goal=+t.value;else if(k==="name")state.name=t.value.trim().slice(0,24);else if(k==="kickoff")state.kickoff=t.value;else if(k==="voiceName"){state.voiceName=t.value;pickVoice();}
  save();if(k!=="name")render();
});
window.addEventListener("hashchange",()=>{ui.drill=null;ui.sheet=false;ui.msg="";render();toTop();});
render();
</script>
</body>
